<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflow inert</title>
<link rel="stylesheet" href="site.css">
<style>
  html, body { overflow-x: hidden; }
  .row { width: 900px; position: relative; height: 40px; }
  .row button { position: absolute; left: 200px; top: 0; width: 300px; }
</style>
</head>
<body>
<main>
  <h1>Reflow inert</h1>
  <p>A fixed-width inert row whose visible button is clipped.</p>
  <div class="row" inert><button type="button">Order now</button></div>
</main>
</body>
</html>
